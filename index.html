const compositionNotes={"リーディングライン":["道路・階段・廊下の床の線などを、主役へ向かって伸びるように配置します。線を目で追うと自然に主役へ視線が集まります。","Arrange paths, stairs, or hallway edges so their lines point toward the subject. The viewer’s eyes follow those lines to the focal point.","長い廊下の奥に魔女を立たせる","Place a witch at the end of a long corridor"],"日の丸構図":["主役を画面のど真ん中に置きます。正面から見せたい顔や、堂々とした魔王の姿に向きます。","Put the subject at the exact center of the frame. Great for direct portraits or an imposing demon king.","玉座の中央に座る魔王","A demon king centered on a throne"],"三分割構図":["画面を縦横それぞれ3等分したと想像し、線が交わる4点のどれかに主役を置きます。反対側には月や城を見せられます。","Imagine a 3×3 grid. Place the subject near one of its four intersections, leaving room for the moon or castle opposite.","左の交点に魔女、右に満月","Witch on the left, moon on the right"],"ローアングル":["カメラを主役より低い位置に置き、下から見上げます。背が高く、強そうに見せたいときに便利。","Place the camera below the subject and look upward to make them appear tall and powerful.","見上げる魔王","Looking up at a demon king"],"ハイアングル":["カメラを主役より高く置いて斜め下を見ます。小ささやかわいさ、弱さを表現できます。","Place the camera above the subject, looking down diagonally to emphasize smallness or vulnerability.","見上げてくる小さな魔女","A tiny witch looking up"],"俯瞰":["高い位置から場面を見下ろします。主役だけでなく周囲の家具や道、人物の位置関係を見せたいときに使います。","Look down from a high vantage point to show the layout of people, furniture, and paths.","魔女の工房を見下ろす","Looking down into a witch workshop"],"真上から":["カメラを床と垂直にして真下へ向けます。机の上の小物や円形の魔法陣を平面的に見せます。","Point the camera straight down, perpendicular to the floor, for flat layouts and circular patterns.","魔法陣を真上から","Magic circle seen directly overhead"],"斜めのダッチアングル":["カメラ自体を左右に傾け、地平線や建物を斜めにします。世界が不安定に見え、ホラーと相性抜群。","Tilt the camera sideways so walls and horizons slant, creating unease and tension.","傾いた幽霊屋敷の廊下","A tilted haunted hallway"],"額縁構図":["窓・扉・アーチ・木の枝などを画面の手前に置き、その囲いの中に主役を入れます。","Place a window, doorway, arch, or branches in the foreground to surround the subject like a picture frame.","扉の向こうに立つ幽霊","A ghost framed by a doorway"],"対角線構図":["階段や道、主役の体の向きを画面の左下から右上など斜めに通します。静止画に動きが出ます。","Arrange stairs, roads, or the subject along a diagonal from one corner toward another to create energy.","斜めに飛ぶ箒","A broom flying diagonally"],"余白を活かす":["主役を小さめに置き、周囲に何もない空間を大きく残します。孤独感や静けさ、タイトルを置く余地を作れます。","Keep the subject small and leave a large empty area for quiet, isolation, or later title placement.","広い夜空の下に一人の魔女","Lone witch beneath a vast sky"],"奥行きのある構図":["手前・中間・奥に別々のものを置きます。例えば手前にかぼちゃ、中間に魔女、奥に古城。","Place objects at three distances: foreground, middle, and background to give the scene depth.","手前にかぼちゃ、中間に魔女、奥に城","Pumpkin, witch, castle"],"中央対称":["画面中央を境に左右の建物や柱が鏡写しに近くなるよう配置します。儀式的で厳かな印象になります。","Balance objects on the left and right like a mirror around the central axis.","左右対称の城の廊下","Symmetrical castle corridor"],"黄金比構図":["主役を中央から少しずらし、周囲の形や視線の流れを自然につなげます。厳密な計算よりバランスを意識して選びます。","Offset the subject from the center and arrange surrounding shapes to create a pleasing visual flow.","曲線の階段と魔女","Curved staircase and witch"],"鏡越し":["主役を直接ではなく鏡に映った姿として見せます。鏡の外側も入れると、不思議さが増します。","Show the subject in a mirror rather than directly; include the mirror frame for an uncanny effect.","鏡に映る吸血鬼","Vampire reflected in a mirror"],"シルエット":["顔や服の細部より、黒っぽい輪郭を目立たせます。背景を明るくすると形が読みやすくなります。","Show the dark outline more than facial or clothing details, against a brighter background.","満月の前の魔女","Witch against the full moon"],"前景ぼかし":["カメラに近いものをぼかして手前に置き、奥の主役にピントを合わせます。こっそり覗くような雰囲気になります。","Blur a nearby foreground object while focusing on the subject behind it, as if peeking through.","ぼけた枝越しの幽霊","Ghost beyond blurry branches"],"浅い被写界深度":["主役の顔など一部だけにピントを合わせ、前後の背景を大きくぼかします。主役に注目させます。","Keep the face or another small area sharp while strongly blurring the background.","背景がぼけた魔女の肖像","Witch portrait with soft background"],"深い被写界深度":["手前から遠くの背景までくっきり描きます。城や街並みを含めて細部を見せたいときに便利。","Keep both near and far objects sharp to show details throughout the scene.","魔界の市場を隅々まで","Detailed demon-world market"],"三角構図":["3人の頭や複数の小物が三角形の頂点になるよう配置します。まとまりと安定感が出ます。","Arrange three heads or objects at the corners of a triangle for a stable grouping.","三人の魔女が三角形に並ぶ","Three witches in a triangle"],"魚眼レンズ風":["画面の中心が大きく見え、端が丸く歪む超広角表現です。近づいた顔をコミカルにも不気味にもできます。","Use a very wide, curved view that enlarges the center and bends the edges.","近づいてくるかぼちゃ頭","Pumpkin head close to the lens"],"一人称視点":["見る人自身がその場にいる視点です。自分の手や目の前の扉を入れると臨場感が増します。","Show the scene through the viewer’s own eyes; visible hands or a door ahead enhance immersion.","自分の手で古城の扉を開ける","Opening a castle door"],"肩越し":["手前の人物の肩や後頭部を少し入れ、その先の相手を見せます。二人の関係を伝えやすい構図。","Show part of a foreground person’s shoulder and head while looking at someone beyond them.","魔女の肩越しに魔王を見る","Demon king over a witch’s shoulder"],"放射状構図":["光や道、建物の線を中心から外へ広がるように配置します。中心の主役に強い注目が集まります。","Arrange light beams or lines radiating outward from a central focal point.","魔法陣の中心の魔女","Witch at the center of radiating magic"],"螺旋構図":["階段・煙・魔法の光などを渦巻き状に配置します。視線がぐるっと回って中心に向かいます。","Arrange stairs, smoke, or magic in a spiral to guide the eye around toward its center.","螺旋階段の上の魔女","Witch atop a spiral staircase"],"全身":["頭から足先まで画面内に収め、衣装全体が見える距離にカメラを置きます。","Frame the subject from head to toe so the entire outfit is visible.","魔女のブーツまで見せる","Show a witch's boots"],"バストアップ":["胸のあたりから頭までを大きく写します。顔の表情と衣装の上半分を両方見せたいときに便利。","Crop around the chest and show the head prominently to emphasize expression and upper clothing.","ゴスロリの襟と微笑み","Gothic collar and smile"],"顔アップ":["顔を画面いっぱいに写し、瞳や口元の表情を目立たせます。背景は少なめにします。","Fill most of the frame with the face to highlight the eyes and expression; show little background.","銀髪の魔女の不気味な微笑み","A silver-haired witch's eerie smile"],"広角の情景":["人物をやや小さくし、周囲の建物や空まで広く見せます。場所の雰囲気を伝えるのに向きます。","Make the character smaller and show a wide area of architecture and sky to establish the setting.","古城と満月の下に立つ魔女","Witch beneath a castle and full moon"],"ダイナミック":["体や衣装を斜めに動かし、前後の距離や勢いを強調します。静かな直立ポーズとは対照的。","Tilt the pose and emphasize motion and depth to create energy rather than a static stance.","マントを翻して飛び出す魔王","Demon king lunging with a flowing cape"],"左右非対称":["左右で人物や物の大きさ・数・位置を変えます。均等に並べず、動きや緊張感を作ります。","Give the two sides unequal visual weight, with different object sizes or placements.","左に大きな魔女、右奥に小さな城","Large witch left, tiny castle far right"],"あおり":["地面近くから強く見上げ、足元を大きく、頭や背景を上方に見せます。迫力が出ます。","Shoot sharply upward from near ground level, enlarging the foreground and emphasizing height.","魔王の足元から玉座を見上げる","Looking up from the demon king's feet"],"アイレベル":["カメラを主役の目と同じ高さに置きます。見る人と対等な距離感で、自然な会話場面に向きます。","Place the camera at the subject's eye height for a natural, equal viewpoint.","魔女と正面で目を合わせる","Meeting a witch's gaze"],"背後から":["人物の背中側にカメラを置き、人物が見ている先の風景も写します。","Place the camera behind the character, showing their back and what lies ahead.","城門を見つめる魔女の後ろ姿","Witch facing a castle gate"],"横顔":["顔を横から写し、鼻先や額の輪郭を強調します。視線の先に空間を残すと自然です。","Show the face in profile, emphasizing its outline; leave space in the direction of the gaze.","満月を見つめる吸血鬼の横顔","Vampire in profile looking at the moon"],"斜め45度":["正面と横顔の中間から写します。両目と鼻の立体感が見え、人物写真によく使われます。","Shoot from about halfway between front and side to show both eyes and facial depth.","少し横を向いた魔女の肖像","Witch portrait turned slightly aside"],"超接写":["顔や小物のごく一部だけを大きく写します。質感や細かな模様を主役にします。","Move extremely close so a tiny detail fills the frame, emphasizing texture.","魔女の指輪に刻まれた魔法陣","Magic sigil engraved on a ring"],"目元アップ":["目と眉の周囲だけを切り取ります。視線や涙、瞳の光を強く印象付けます。","Crop tightly around the eyes and brows to emphasize gaze and emotion.","赤く光る吸血鬼の瞳","Glowing red vampire eyes"],"手元アップ":["手と持っている道具を大きく写し、何をしているかを伝えます。指の形が見える角度にします。","Frame the hands and objects closely to show the action clearly.","魔法薬を注ぐ魔女の手","Witch's hands pouring a potion"],"上半身":["腰から上を写し、表情だけでなく腕のポーズも見せます。","Frame from the waist up so facial expressions and arm gestures are visible.","杖を掲げる魔法使い","Wizard raising a staff"],"膝上ショット":["膝の少し上から頭までを写します。衣装を広く見せつつ表情も読み取れます。","Frame from just above the knees to the head, balancing outfit details and expression.","コート姿のゴーストハンター","Ghost hunter wearing a coat"],"全身と背景":["足先まで人物を入れ、背景にも十分な面積を割きます。衣装と場所の両方が伝わります。","Show the full figure with enough surrounding scenery to establish the location.","墓地に立つ魔女の全身","Full-length witch in a graveyard"],"超広角":["広い範囲を一度に入れ、手前の物を大きく奥を小さく見せます。端の形が歪む場合があります。","Use an extremely wide field of view; near objects loom large and distant ones shrink.","手前のかぼちゃと遠くの古城","Pumpkin foreground, distant castle"],"望遠圧縮":["遠くから望遠で写したように、人物と背景の距離が近く見える表現です。","Use a telephoto-like view that makes the distant background appear closer to the subject.","満月が巨大に見える魔女の肖像","Witch with an enormous-looking moon"],"シネマスコープ":["映画のような非常に横長の画面で、人物の左右に風景を広く配置します。","Use a very wide cinematic frame, placing scenery to either side of the subject.","横長の城の広間で対峙する二人","Two rivals in a wide castle hall"],"パノラマ":["左右に長く続く風景を広範囲に見せます。人物は小さくても、場所全体の広がりを表せます。","Show an expansive, sweeping landscape across a very wide frame.","ハロウィンの街並み全景","Halloween town panorama"],"逆光シルエット":["主役の背後に強い光を置き、手前側を暗くします。輪郭と光の縁取りを際立たせます。","Put a bright light behind the subject and keep the front dark to reveal a strong outline.","満月を背にしたコウモリの翼","Bat wings against a full moon"],"窓越し":["窓枠やガラスを手前に入れ、その向こうの主役を見せます。内外の距離感や覗き見る印象が出ます。","Frame the subject through a window, including the frame or glass to suggest separation.","窓の外に立つ幽霊","Ghost outside a window"],"扉の隙間から":["少し開いた扉の細い隙間を通して主役の一部を見せます。見えない部分が恐怖を生みます。","Show only part of the subject through a narrowly opened door to create suspense.","隙間から覗く赤い目","Red eye peering through a door"],"木々の間から":["手前の木の幹や枝の間に主役を置きます。森の奥を覗くような奥行きが出ます。","Place the subject between foreground trunks and branches, as though seen deep in a forest.","木の間に現れる幽霊","Ghost appearing between trees"],"階段を使った構図":["階段の斜め線や段差を使い、視線を上下に動かします。主役を踊り場に置くと目立ちます。","Use stair edges and levels to lead the eye up or down; place the subject on a landing.","大階段の上に立つ魔王","Demon king atop a staircase"],"トンネル構図":["通路やアーチが作る暗い囲いの奥に主役を置きます。出口の光が目を引きます。","Place the subject at the end of an enclosing tunnel or arch; the exit draws attention.","暗い地下道の出口の魔女","Witch at a tunnel exit"],"反射を使った構図":["鏡・ガラス・金属などに映る姿と実物を同じ画面に入れます。二重の見え方を楽しめます。","Include both a subject and its reflection in glass, metal, or a mirror.","鏡と本人で表情が違う魔女","Witch and mirror reflection with different expressions"],"水面反射":["水たまりや湖を画面下側に置き、上の景色が逆さに映るようにします。","Put water in the lower frame to mirror the scene upside down.","水たまりに映る古城と月","Castle and moon reflected in a puddle"],"動きのある流し撮り":["動く主役を追うカメラを想定し、主役を比較的鮮明に、背景を横方向に流して描きます。","Simulate tracking a moving subject: keep it relatively sharp while the background streaks sideways.","箒で疾走する魔女","Witch speeding on a broom"],"ジャンプの瞬間":["人物が地面から離れた瞬間を捉え、足と地面の間に空間を作ります。","Capture the subject midair with visible space between feet and ground.","跳び上がるかぼちゃの妖精","Pumpkin fairy leaping"],"回転する動き":["髪・スカート・マントを円を描くように広げ、体のひねりを見せます。","Show a twisting pose with hair, skirt, or cape sweeping around in arcs.","回転するゴシックドレス","Spinning gothic dress"],"群像配置":["複数の人物を前後左右にずらして配置し、顔が重ならないようにします。集団の賑やかさが出ます。","Stagger several characters across depth and width so faces remain visible.","仮装したおばちゃん軍団の集合写真","Group portrait of costumed women"],"二人の対比":["二人を左右に分け、身長・衣装・明るさ・表情の違いを際立たせます。","Place two characters on opposite sides and contrast size, costume, light, or expression.","白い天使と黒い悪魔","White angel versus black demon"],"背中合わせ":["二人の背中を合わせ、顔を反対方向へ向けます。協力や対立を同時に表現できます。","Position two figures back-to-back facing opposite ways to suggest alliance or tension.","魔女と吸血鬼が背中合わせ","Witch and vampire back-to-back"],"中央に主役と周囲に仲間":["中心に一番目立たせたい人物を置き、仲間を左右や後ろに小さめに配置します。","Put the lead character prominently in the center, with companions smaller at the sides or behind.","中央の魔王と左右の幹部","Demon king flanked by lieutenants"],"ポスター風":["主役を大きく印象的に配置し、周囲にタイトルを置ける余白を残します。","Create a bold focal subject and reserve clean space for a possible title.","魔女の映画ポスター","Witch movie poster"],"雑誌表紙風":["顔や上半身を大きく写し、周辺に見出しを置ける空間を作ります。文字は別途追加できます。","Feature a large portrait with clear space around it for editorial cover lines.","ハロウィン衣装特集の表紙","Halloween fashion cover"],"主役を左寄せ":["主役を画面の左側に配置し、右側は背景の装飾を控えて広くすっきりした余白にします。右側へ文字を後から載せたい場合にも便利です。","Place the main subject on the left, and keep the right side open with simple, low-detail background. Useful when adding a title on the right afterward.","左側に悪魔の執事、右側は静かな青い霧","Demon butler left, quiet blue mist on the right"],"主役を右寄せ":["主役を画面の右側に配置し、左側は背景の装飾を控えて広くすっきりした余白にします。左側にタイトルなどを後から載せやすくなります。","Place the main subject on the right, and keep the left side open with simple, low-detail background. Useful when adding a title on the left afterward.","右側に魔女、左側は暗い夜空の余白","Witch right, uncluttered night sky on the left"],"主役を上寄せ":["主役を画面の上側に配置し、下側に広くすっきりした余白を残します。縦長の絵や下部に説明を足すカードにも向いています。","Position the main subject in the upper part of the frame, leaving a spacious, uncluttered area below. Useful for vertical art or cards with captions added later.","上に小さな幽霊、下に静かな霧の空間","Small ghost above, quiet misty space below"],"主役を下寄せ":["主役を画面の下側に配置し、上側に広くすっきりした余白を残します。空や月を生かした絵、上部に文字を後から追加する画像に向いています。","Position the main subject in the lower part of the frame, leaving a spacious, uncluttered area above. Useful for sky-heavy scenes or titles added at the top later.","下にかぼちゃ頭の紳士、上に広い夜空","Pumpkin-headed gentleman below, broad night sky above"],"縦型スマホ壁紙向け":["縦長の画面に主役を配置し、上部の時計や下部のアイコンに顔が重ならないようにします。","Compose vertically, keeping the face clear of the top clock and bottom icons.","中央に魔女、上部は夜空","Witch centered with clear night sky above"],"バナー向け横長配置":["横長の細い範囲に主役を片側へ寄せ、文字やロゴを入れる場所を空けます。","Arrange the subject on one side of a shallow wide banner and leave room for text or a logo.","左にかぼちゃ、右は告知文用","Pumpkin left, announcement space right"],"絵本の見開き":["左右2ページを一つの横長絵として扱い、中央の折り目に顔など重要なものを置かないようにします。","Design one wide illustration across two pages, keeping faces away from the center fold.","左ページに魔女、右ページにお城","Witch left page, castle right page"],"漫画の一コマ風":["一場面を漫画の一コマとして切り取り、人物の表情や動作がひと目でわかる配置にします。","Compose a single manga panel with clear action and readable facial expression.","魔女が驚いて振り返る一コマ","Witch turning in surprise"],"左右分割画面":["画面を縦に二つに分け、左右に別の人物や場所を置いて比較します。","Split the frame vertically into two scenes or characters for contrast.","左は魔女、右は吸血鬼","Witch left, vampire right"],"上下分割画面":["画面を横に二つに分け、上と下で別の場面や視点を見せます。","Split the frame horizontally to show different scenes or viewpoints above and below.","上は城、下は地下牢","Castle above, dungeon below"],"ミニチュア俯瞰":["高い位置から小さな模型を見るように写します。建物や人がジオラマのように見えます。","Look down from high above as if viewing a tiny model, making the scene resemble a diorama.","小さな魔女の街を上から見る","Tiny witch town from above"],"自由入力・指定なし":["構図を固定せず、追加指定欄に希望を書くか、画像生成AIに配置を任せます。","No fixed composition; describe your own arrangement in the extra details field or let the image model choose.","自由入力に「左側に主役」と記入","Enter 'subject on the left' in extra details"]};
function updateCompositionGuide(){const select=document.getElementById('composition');if(!select)return;const idx=+select.value;const ja=defs.find(d=>d[0]==='composition')[2][idx][0];const en=language==='en';const note=compositionNotes[ja];const name=en?optionsEn.composition[idx]:ja;document.getElementById('guideName').textContent=name+(en?' — Composition':'');document.getElementById('guideText').textContent=note?(en?note[1]:note[0]):(en?'A detailed beginner explanation is not available for this composition yet.':'この構図の初心者向け解説は準備中です。');document.getElementById('guideExample').textContent=note?(en?'Example: ':'使用例：')+(en?note[3]:note[2]):'';}
document.getElementById('composition').addEventListener('change',updateCompositionGuide);
function get(i){let d=defs[i],idx=+document.getElementById(d[0]).value;return d[2][idx]};function generate(){let j=defs.map((d,i)=>`${d[1]}：${get(i)[0]}`).join('。');const compositionDirections={"主役を左寄せ":"主役を画面左側に配置し、右側は装飾を控えた広い余白として空ける","主役を右寄せ":"主役を画面右側に配置し、左側は装飾を控えた広い余白として空ける","主役を上寄せ":"主役を画面上側に配置し、下側は装飾を控えた広い余白として空ける","主役を下寄せ":"主役を画面下側に配置し、上側は装飾を控えた広い余白として空ける"};const compositionDirection=compositionDirections[get(7)[0]];if(compositionDirection)j+='。配置指定：'+compositionDirection;let e=defs.map((d,i)=>get(i)[1]).filter(Boolean).join(', ');const selectedRatio=get(8)[1];if(/^\d+x\d+$/.test(selectedRatio)){const [w,h]=selectedRatio.split('x').map(Number);j+='。画像サイズ：'+w+'×'+h+'px（比率 '+w+':'+h+'）';e+=', target canvas '+w+'x'+h+' pixels, aspect ratio '+w+':'+h+'; keep key elements inside safe margins';}let x=document.getElementById('custom').value.trim(),r=document.getElementById('customRatio').value.trim();if(r){j+='。指定画面比率：'+r;e+=', aspect ratio '+r}if(x){j+='。追加指定：'+x;e+=', additional details: '+x}const noText=get(9)[0]==='文字なし';const noTextJa=noText?'【文字の禁止（最優先）】画像内には一切の文字を描かないでください。タイトル、見出し、字幕、数字、英字、日本語、看板の文字、ロゴ、署名、透かし、装飾的な文字も禁止です。表紙やポスターのような画風でも文字を追加せず、絵だけで完成させてください。':'';const noTextEn=noText?' CRITICAL: Absolutely no visible text anywhere in the image. No titles, headings, captions, letters, numbers, Japanese or other scripts, signs with writing, logos, signatures, watermarks, or decorative typography. Even if the composition resembles a book cover or poster, create artwork only; do not invent a title or any lettering.':'';document.getElementById('ja').value='ハロウィンをテーマにした魅力的な画像を制作してください。'+j+'。キャラクターの一貫性、自然な手指、整った構図を重視。'+noTextJa;document.getElementById('en').value='Create a compelling Halloween-themed image featuring '+e+'. Maintain consistent character design, anatomically natural hands, and a coherent composition.'+noTextEn}function randomize(){defs.forEach(d=>{let s=document.getElementById(d[0]);s.selectedIndex=Math.floor(Math.random()*s.options.length)});generate();updateCompositionGuide()}function resetAll(){defs.forEach(d=>document.getElementById(d[0]).selectedIndex=0);document.getElementById('custom').value='';document.getElementById('customRatio').value='';generate();updateCompositionGuide()}async function copy(id){const t=document.getElementById(id),b=document.getElementById(id==='ja'?'copyJa':'copyEn');let ok=false;try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){t.select();try{ok=document.execCommand('copy')}catch(_){ok=false}}if(ok){b.textContent=language==='ja'?'✓ コピーしました！':'✓ Copied!';clearTimeout(b._restore);b._restore=setTimeout(()=>{b.textContent=language==='ja'?'📋 プロンプトをコピー':'📋 Copy Prompt'},1800)}else{b.textContent=language==='ja'?'コピーできませんでした':'Copy failed'}}generate();syncResultLanguage();updateCompositionGuide();</script></body></html>
